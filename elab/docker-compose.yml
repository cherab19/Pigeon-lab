services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pigeonlab
      POSTGRES_USER: pigeonlab
      POSTGRES_PASSWORD: pigeonlab
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pigeonlab -d pigeonlab"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://pigeonlab:pigeonlab@db:5432/pigeonlab
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: development-only-change-me
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      INVITE_TOKEN_SECRET: development-only-change-me
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
    volumes: ["storage:/app/storage"]
volumes: { pgdata: {}, storage: {} }
